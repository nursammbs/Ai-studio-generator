name: Quick Video Studio
on:
  push:
    branches: [feat/cpu-first-quick-video-mvp]
  pull_request:
    branches: [feature/revenue-engine-2027-foundation]
    paths:
      - "quick-video-studio/**"
      - ".github/workflows/quick-video-studio.yml"
jobs:
  cpu-first-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependency
        run: python -m pip install Pillow
      - name: Run unit tests
        working-directory: quick-video-studio
        run: python -m unittest discover -s tests -v
      - name: Render sample MP4
        working-directory: quick-video-studio
        run: |
          python render.py example.json --output sample.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 sample.mp4
      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-video-studio-sample
          path: |
            quick-video-studio/sample.mp4
            quick-video-studio/sample.srt
