name: AI Anime Studio tests

on:
  push:
    paths:
      - "ai-anime-studio/**"
      - ".github/workflows/ai-anime-studio.yml"
  pull_request:
    paths:
      - "ai-anime-studio/**"
      - ".github/workflows/ai-anime-studio.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-anime-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-anime-studio/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg for media integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile Python files
        run: python -m py_compile app.py engine.py sprite_animator.py sprite_animator_v2.py youtube_upload.py studio_pipeline.py workflow_inspect.py generate_motion_guides.py
      - name: Run tests
        run: python -m pytest -q
