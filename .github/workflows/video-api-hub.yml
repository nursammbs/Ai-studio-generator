name: Video API Hub tests

on:
  push:
    paths:
      - "video-api-hub/**"
      - ".github/workflows/video-api-hub.yml"
  pull_request:
    paths:
      - "video-api-hub/**"
      - ".github/workflows/video-api-hub.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-api-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: video-api-hub/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install optional MCP bridge dependencies
        run: pip install -r requirements-mcp.txt
      - name: Compile API and MCP apps
        run: python -m py_compile app.py mcp_server.py
      - name: Verify MCP bridge import
        run: python -c "import mcp_server; print('MCP bridge imports successfully')"
      - name: Run unit tests
        run: pytest -q
