name: Personal AI Workbench checks

on:
  push:
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent.yml"
  pull_request:
    paths:
      - "personal-ai-agent/**"
      - ".github/workflows/personal-ai-agent.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-ai-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile app.py agent_core.py
      - name: Run unit tests
        run: PYTHONPATH=. pytest -q
