name: Revenue Engine Clipper CI

on:
  push:
    branches: ["feature/revenue-engine-2027-foundation"]
    paths:
      - "revenue-engine/clipper/**"
      - ".github/workflows/revenue-engine-clipper.yml"
  pull_request:
    paths:
      - "revenue-engine/clipper/**"
      - ".github/workflows/revenue-engine-clipper.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      RUN_VIDEO_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-base-ubuntu-latest
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r revenue-engine/clipper/requirements-clipper.txt
      - name: Run unit, UI, media and transcription smoke tests
        working-directory: revenue-engine/clipper
        run: python -m unittest discover -s tests -v
