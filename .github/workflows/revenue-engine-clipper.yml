name: Revenue Engine Clipper CI

on:
  push:
    branches: ["feature/revenue-engine-2027-foundation"]
    paths:
      - "revenue-engine/clipper/**"
      - ".github/workflows/revenue-engine-clipper.yml"
  pull_request:
    paths:
      - "revenue-engine/clipper/**"
      - ".github/workflows/revenue-engine-clipper.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg for the media smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run unit and MP4 smoke tests
        working-directory: revenue-engine/clipper
        run: python -m unittest discover -s tests -v
